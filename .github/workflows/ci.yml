name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: flake8 (syntax errors / undefined names)
        run: flake8 src/ tests/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (style, non-blocking)
        run: flake8 src/ tests/ main.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: black
        run: black --check --diff src/ tests/ main.py config/

      - name: isort
        run: isort --check-only --diff src/ tests/ main.py config/

      - name: mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  smoke:
    # Exercise the actual app entry points (CLI + web UI), not just unit tests.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web_ui/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r web_ui/requirements.txt

      - name: CLI - list templates
        run: python main.py --list-templates

      - name: CLI - validate leads
        run: |
          printf 'Category,Business Name,Phone Number\nTest,Acme Co,+97431691362\nBad,Nope Inc,not-a-number\n' > leads.csv
          python main.py --validate-leads leads.csv

      - name: CLI - dry-run campaign
        run: python main.py --leads leads.csv --template meeting_request --dry-run

      - name: Web UI - smoke test
        run: python web_ui/smoke_test.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whatsapp-automation-tool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: docker run --rm --entrypoint python whatsapp-automation-tool:ci main.py --list-templates

  security:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: bandit (SAST, non-blocking)
        run: bandit -r src/ web_ui/ -ll -f txt -o bandit-report.txt || true

      - name: pip-audit (dependency CVEs, non-blocking)
        run: pip-audit -r requirements.txt --desc || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.txt
          if-no-files-found: warn
